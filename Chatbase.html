<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbase Bot Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef1f4;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #222;
    }
    p {
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Chatbase Bot Page</h1>
  <p>Interact with the chatbot by clicking the widget at the bottom right.</p>

  <!-- Chatbase Embed Script -->
  <script>
    (function () {
      if (!window.chatbase || window.chatbase("getState") !== "initialized") {
        window.chatbase = (...args) => {
          if (!window.chatbase.q) {
            window.chatbase.q = [];
          }
          window.chatbase.q.push(args);
        };
        window.chatbase = new Proxy(window.chatbase, {
          get(target, prop) {
            if (prop === "q") {
              return target.q;
            }
            return (...args) => target(prop, ...args);
          },
        });
      }

      const onLoad = function () {
        const script = document.createElement("script");
        script.src = "https://www.chatbase.co/embed.min.js";
        script.id = "KQ4NJnNo5ixuMx0zDlHQL"; // <-- This is your actual chatbot ID
        script.domain = "www.chatbase.co";
        document.body.appendChild(script);
      };

      if (document.readyState === "complete") {
        onLoad();
      } else {
        window.addEventListener("load", onLoad);
      }
    })();
  </script>

</body>
</html>
